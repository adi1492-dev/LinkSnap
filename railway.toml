[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"

[env]
NODE_ENV = "production"
# Remember to add these in your Railway dashboard:
# FRONTEND_URL = "https://your-vercel-domain.vercel.app"
# TURSO_DATABASE_URL = "libsql://..."
# TURSO_AUTH_TOKEN = "..."
