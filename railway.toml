[build]
builder = "DOCKERFILE"

[deploy]
# Dockerfile exposes port 3000 and runs node server.js automatically
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"

[env]
NODE_ENV = "production"
# Remember to add these in your Railway dashboard:
# FRONTEND_URL = "https://your-vercel-domain.vercel.app"
# TURSO_DATABASE_URL = "libsql://..."
# TURSO_AUTH_TOKEN = "..."
